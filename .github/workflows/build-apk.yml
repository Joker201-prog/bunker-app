name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Expo project (SDK 54)
        run: |
          npx --yes create-expo-app@latest app --template blank-typescript@sdk-54 --yes
          rm -rf app/src
          cp -r src app/src
          cp App.tsx app/App.tsx
          cp app.config.overrides.json app/
          mkdir -p app/assets && cp -r assets/. app/assets/

      - name: Install fonts and splash
        working-directory: app
        run: npx expo install expo-font expo-splash-screen @expo-google-fonts/russo-one @expo-google-fonts/pt-sans @expo-google-fonts/pt-mono

      - name: Configure app.json
        working-directory: app
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const o = JSON.parse(fs.readFileSync("app.config.overrides.json", "utf8"));
            cfg.expo = { ...cfg.expo, ...o.expo, android: { ...(cfg.expo.android || {}), ...o.expo.android } };
            const splash = ["expo-splash-screen", { image: "./assets/splash-icon.png", imageWidth: 200, resizeMode: "contain", backgroundColor: "#16181b" }];
            cfg.expo.plugins = (cfg.expo.plugins || []).filter((p) => (Array.isArray(p) ? p[0] : p) !== "expo-splash-screen");
            cfg.expo.plugins.push(splash);
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
            console.log(JSON.stringify(cfg, null, 2));
          '

      - name: Prebuild Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk ubezhishe-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ubezhishe-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Убежище, сборка ${{ github.run_number }}
          body: APK прототипа игры «Убежище». Установите на Android, разрешив установку из неизвестных источников.
          files: ubezhishe-${{ github.run_number }}.apk
