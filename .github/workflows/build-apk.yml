name: Build APK

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Expo project (SDK 54)
        run: |
          npx --yes create-expo-app@latest app --template blank-typescript@sdk-54 --yes
          rm -rf app/src
          cp -r src app/src
          cp App.tsx app/App.tsx
          cp app.config.overrides.json app/
          mkdir -p app/assets && cp -r assets/. app/assets/

      - name: Install native modules and fonts
        working-directory: app
        run: npx expo install expo-font expo-splash-screen expo-build-properties react-native-safe-area-context @react-native-async-storage/async-storage expo-network expo-keep-awake react-native-tcp-socket buffer @expo-google-fonts/oswald @expo-google-fonts/pt-sans @expo-google-fonts/pt-mono @expo-google-fonts/caveat react-native-svg expo-haptics expo-linear-gradient

      - name: Configure app.json
        working-directory: app
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const o = JSON.parse(fs.readFileSync("app.config.overrides.json", "utf8"));
            cfg.expo = { ...cfg.expo, ...o.expo, android: { ...(cfg.expo.android || {}), ...o.expo.android } };
            const splash = ["expo-splash-screen", { image: "./assets/splash-icon.png", imageWidth: 200, resizeMode: "contain", backgroundColor: "#2b1d13" }];
            cfg.expo.plugins = (cfg.expo.plugins || []).filter((p) => (Array.isArray(p) ? p[0] : p) !== "expo-splash-screen");
            cfg.expo.plugins.push(splash);
            // http:// нужен для сервера в домашней сети (например, на своём компьютере)
            cfg.expo.plugins = cfg.expo.plugins.filter((p) => (Array.isArray(p) ? p[0] : p) !== "expo-build-properties");
            cfg.expo.plugins.push(["expo-build-properties", { android: { usesCleartextTraffic: true } }]);
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
            console.log(JSON.stringify(cfg, null, 2));
          '

      - name: Prebuild Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk ubezhishe-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ubezhishe-${{ github.run_number }}.apk

      - name: Prepare release notes
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            sed "s/{{BUILD}}/${{ github.run_number }}/g; s/{{TAG}}/build-${{ github.run_number }}/g" release-notes.md > release-body.md
          else
            {
              echo "**Тестовая сборка** из ветки \`${{ github.ref_name }}\` — для проверки перед выпуском."
              echo
              sed "s/{{BUILD}}/${{ github.run_number }}/g; s/{{TAG}}/preview-${{ github.run_number }}/g" release-notes.md
            } > release-body.md
          fi

      - name: Publish release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Убежище, сборка ${{ github.run_number }}
          body_path: release-body.md
          files: ubezhishe-${{ github.run_number }}.apk

      - name: Publish test build
        if: github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Убежище, тестовая сборка ${{ github.run_number }}
          prerelease: true
          body_path: release-body.md
          files: ubezhishe-${{ github.run_number }}.apk
